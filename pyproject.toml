[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virvig-group-history"
version = "0.1.0"
description = "Import, validate, and export ViRVIG group history records"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "docxcompose>=2,<3",
    "docxtpl>=0.20.1",
    "jinja2>=3.1.6",
    "lxml",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "truststore>=0.10.4",
]

# The scripts run from the repository alongside the Word templates.
[tool.setuptools]
packages = []
py-modules = []
